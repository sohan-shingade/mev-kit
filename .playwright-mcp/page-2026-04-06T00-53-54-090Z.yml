              - heading "How CEX-DEX Arbitrage Works" [level=1] [ref=e685]
              - heading "The Core Concept" [level=2] [ref=e686]
              - paragraph [ref=e687]: CEX-DEX arbitrage exploits temporary price differences between a centralized exchange (CEX) and a decentralized exchange (DEX) for the same asset pair. In mev-kit's reference implementation, the pair is SOL/USDC, the CEX is Binance, and the DEX is Raydium.
              - paragraph [ref=e688]: "The strategy is conceptually simple:"
              - list [ref=e689]:
                - listitem [ref=e690]: Receive a live price tick from Binance via WebSocket
                - listitem [ref=e691]: Receive the current pool state from Raydium (via Helius or Geyser)
                - listitem [ref=e692]: Calculate the spread between the two prices
                - listitem [ref=e693]: If the spread exceeds a profitable threshold, submit a swap on Raydium
              - paragraph [ref=e694]: "The difficulty lies not in the concept but in the execution: speed, fee management, simulation, and position sizing all determine whether a strategy is net profitable over time."
              - separator [ref=e695]
              - heading "Price Representations" [level=2] [ref=e696]
              - paragraph [ref=e697]: Before covering the math, it helps to be precise about what "price" means in each venue.
              - heading "Binance Price" [level=3] [ref=e698]
              - paragraph [ref=e699]:
                - text: Binance streams best-bid and best-ask prices via WebSocket. The mid-price is
                - code [ref=e700]: (best_bid + best_ask) / 2
                - text: ". For most arb calculations, you use the side you intend to trade against:"
              - list [ref=e701]:
                - listitem [ref=e702]:
                  - text: If you are
                  - strong [ref=e703]: buying SOL on Binance
                  - text: (to hedge a DEX sell), use the
                  - strong [ref=e704]: ask price
                  - text: (the price at which Binance will sell to you)
                - listitem [ref=e705]:
                  - text: If you are
                  - strong [ref=e706]: selling SOL on Binance
                  - text: (to hedge a DEX buy), use the
                  - strong [ref=e707]: bid price
                  - text: (the price at which Binance will buy from you)
              - paragraph [ref=e708]:
                - text: For simplicity, mev-kit's
                - code [ref=e709]: CEXDEXArbDetector
                - text: uses the mid-price as a signal and treats the bid-ask spread as part of execution cost.
              - heading "Raydium (DEX) Price" [level=3] [ref=e710]
              - paragraph [ref=e711]:
                - text: Raydium's constant-product AMM prices assets according to the formula
                - code [ref=e712]: x * y = k
                - text: ", where"
                - code [ref=e713]: x
                - text: and
                - code [ref=e714]: "y"
                - text: "are the reserve amounts of each token. The instantaneous price is:"
              - code [ref=e717]: price = reserve_quote / reserve_base
              - paragraph [ref=e718]:
                - text: "For SOL/USDC:"
                - code [ref=e719]: price = usdc_reserve / sol_reserve
              - paragraph [ref=e720]:
                - text: This is the price for an infinitesimally small trade. Any real trade larger than zero moves the price. Larger trades face worse effective prices — this is
                - strong [ref=e721]: price impact
                - text: (also called slippage in the AMM context).
              - paragraph [ref=e722]:
                - text: The
                - code [ref=e723]: PoolState
                - text: model in mev-kit carries
                - code [ref=e724]: reserve_base
                - text: ","
                - code [ref=e725]: reserve_quote
                - text: ", and a"
                - code [ref=e726]: fee_bps
                - text: field used in spread calculations.
              - separator [ref=e727]
              - heading "Spread Calculation" [level=2] [ref=e728]
              - paragraph [ref=e729]: "The raw spread between CEX and DEX prices, expressed in basis points (bps), is:"
              - code [ref=e732]: spread_bps = |cex_price - dex_price| / cex_price * 10000
              - paragraph [ref=e733]: One basis point equals 0.01%. A spread of 30bps means the two prices differ by 0.30%.
              - paragraph [ref=e734]: "In Python:"
              - code [ref=e737]: "def calculate_spread_bps(cex_price: float, dex_price: float) -> float: \"\"\"Calculate the absolute spread between CEX and DEX prices in basis points.\"\"\" return abs(cex_price - dex_price) / cex_price * 10_000"
              - paragraph [ref=e738]: This raw spread is gross — it does not account for fees. A spread of 30bps with 30bps in fees yields zero net profit.
              - separator [ref=e739]
              - heading "Net Spread After Fees" [level=2] [ref=e740]
              - paragraph [ref=e741]: "The net spread is the gross spread minus all fees paid to execute the trade:"
              - code [ref=e744]: net_spread_bps = spread_bps - fee_bps
              - paragraph [ref=e745]:
                - text: Where
                - code [ref=e746]: fee_bps
                - text: "includes:"
              - table [ref=e747]:
                - rowgroup [ref=e748]:
                  - row "Cost Typical Value Notes" [ref=e749]:
                    - columnheader "Cost" [ref=e750]
                    - columnheader "Typical Value" [ref=e751]
                    - columnheader "Notes" [ref=e752]
                - rowgroup [ref=e753]:
                  - row "Raydium swap fee 25–30 bps Charged on each swap" [ref=e754]:
                    - cell "Raydium swap fee" [ref=e755]
                    - cell "25–30 bps" [ref=e756]
                    - cell "Charged on each swap" [ref=e757]
                  - row "Priority fee 1–10 bps Depends on congestion" [ref=e758]:
                    - cell "Priority fee" [ref=e759]
                    - cell "1–10 bps" [ref=e760]
                    - cell "Depends on congestion" [ref=e761]
                  - row "Jito tip 1–20 bps Depends on competition" [ref=e762]:
                    - cell "Jito tip" [ref=e763]
                    - cell "1–20 bps" [ref=e764]
                    - cell "Depends on competition" [ref=e765]
                  - row "Binance trading fee 2–10 bps Depends on tier" [ref=e766]:
                    - cell "Binance trading fee" [ref=e767]
                    - cell "2–10 bps" [ref=e768]
                    - cell "Depends on tier" [ref=e769]
                  - row "Slippage variable Depends on position size and pool depth" [ref=e770]:
                    - cell "Slippage" [ref=e771]
                    - cell "variable" [ref=e772]
                    - cell "Depends on position size and pool depth" [ref=e773]
              - paragraph [ref=e774]: "For a basic calculation using Raydium at 30bps and a Jito tip of 10bps:"
              - code [ref=e777]: "RAYDIUM_FEE_BPS = 30 ESTIMATED_PRIORITY_AND_TIP_BPS = 10 def net_spread_bps(gross_spread_bps: float) -> float: total_fees = RAYDIUM_FEE_BPS + ESTIMATED_PRIORITY_AND_TIP_BPS return gross_spread_bps - total_fees"
              - paragraph [ref=e778]:
                - text: A strategy is viable only when
                - code [ref=e779]: net_spread_bps > 0
                - text: . In practice, you want a buffer above zero — called
                - code [ref=e780]: min_spread_bps
                - text: in mev-kit config — to account for fee estimation error and execution variance.
              - separator [ref=e781]
              - heading "Trade Direction" [level=2] [ref=e782]
              - paragraph [ref=e783]: "The direction of the arb trade determines which venue you buy on and which you sell on. There are two cases:"
              - 'heading "Case 1: DEX Price < CEX Price (BUY_DEX)" [level=3] [ref=e784]'
              - paragraph [ref=e785]: The on-chain price is below the Binance price. SOL is "cheap" on Raydium relative to Binance.
              - paragraph [ref=e786]: "Action: buy SOL on Raydium (swap USDC for SOL), sell SOL on Binance."
              - code [ref=e789]: "if dex_price < cex_price: direction = OpportunityType.BUY_DEX"
              - 'heading "Case 2: DEX Price > CEX Price (SELL_DEX)" [level=3] [ref=e790]'
              - paragraph [ref=e791]: The on-chain price is above the Binance price. SOL is "expensive" on Raydium.
              - paragraph [ref=e792]: "Action: sell SOL on Raydium (swap SOL for USDC), buy SOL on Binance."
              - code [ref=e795]: "if dex_price > cex_price: direction = OpportunityType.SELL_DEX"
              - paragraph [ref=e796]:
                - text: In mev-kit, these correspond to the
                - code [ref=e797]: OpportunityType
                - text: enum values
                - code [ref=e798]: CEX_DEX_ARB_BUY
                - text: and
                - code [ref=e799]: CEX_DEX_ARB_SELL
                - text: in
                - code [ref=e800]: src/mev_kit/models/opportunity.py
                - text: .
              - paragraph [ref=e801]: The CEX leg (buying or selling on Binance) is not automated in the free-tier implementation. The mev-kit pipeline handles the on-chain (DEX) leg and logs the required CEX action. Full hedging automation is a pro-tier feature.
              - separator [ref=e802]
              - heading "Profit Estimation" [level=2] [ref=e803]
              - paragraph [ref=e804]: "Given a net spread in basis points and a position size in USDC, the estimated gross profit is:"
              - code [ref=e807]: profit_usd = (net_spread_bps / 10000) * position_size_usd
              - paragraph [ref=e808]: "For example: a 20bps net spread on a $1,000 position yields $2.00 gross profit per trade."
              - paragraph [ref=e809]:
                - text: In Python (as used in
                - code [ref=e810]: CEXDEXArbDetector
                - text: "):"
              - code [ref=e813]: "def estimate_profit( net_spread_bps: float, position_size_usd: float, ) -> float: \"\"\"Estimate gross USD profit for a given spread and position size.\"\"\" return (net_spread_bps / 10_000) * position_size_usd"
              - heading "Position Size and Pool Depth" [level=3] [ref=e814]
              - paragraph [ref=e815]:
                - text: The
                - code [ref=e816]: position_size_usd
                - text: parameter must be chosen carefully relative to the pool's liquidity. A large position on a shallow pool causes significant slippage, which can wipe out the spread entirely or even result in a loss.
              - paragraph [ref=e817]:
                - text: The effective price you receive for a swap of size
                - code [ref=e818]: delta_x
                - text: "on a constant-product AMM is:"
              - code [ref=e821]: effective_price = y / (x + delta_x) * delta_x / delta_x = y * x / ((x + delta_x) * x) ... simplifies to ... price_impact_bps = delta_x / (x + delta_x) * 10000
              - paragraph [ref=e822]: "A rough rule: limit position size to 0.1–0.5% of the pool's total liquidity to keep slippage below 10bps."
              - paragraph [ref=e823]:
                - text: mev-kit exposes
                - code [ref=e824]: max_position_size_usd
                - text: and
                - code [ref=e825]: max_price_impact_bps
                - text: as config parameters. The simulator cross-checks these against real pool reserves before allowing a trade to proceed.
              - separator [ref=e826]
              - heading "Complete Spread Analysis Example" [level=2] [ref=e827]
              - code [ref=e830]: "# Prices cex_price = 180.50 # Binance SOL/USDC mid-price dex_price = 180.00 # Raydium instantaneous price position_size_usd = 500.0 # Gross spread gross_spread_bps = abs(cex_price - dex_price) / cex_price * 10_000 # = 0.50 / 180.50 * 10000 = 27.7 bps # Fees raydium_fee_bps = 30 priority_fee_bps = 5 jito_tip_bps = 8 binance_fee_bps = 4 total_fee_bps = raydium_fee_bps + priority_fee_bps + jito_tip_bps + binance_fee_bps # = 47 bps # Net spread (negative! Not profitable) net_spread_bps = gross_spread_bps - total_fee_bps # = 27.7 - 47 = -19.3 bps --> SKIP # If instead cex_price = 181.50 (1.50 spread): gross_spread_bps_2 = abs(181.50 - 180.00) / 181.50 * 10_000 # = 1.50 / 181.50 * 10000 = 82.6 bps net_spread_bps_2 = 82.6 - 47 # = 35.6 bps --> PROFITABLE profit_usd = (35.6 / 10_000) * 500.0 # = $0.178 per trade"
              - paragraph [ref=e831]: A $0.178 profit per trade sounds small, but at high frequency — multiple trades per minute during volatile markets — it compounds meaningfully.
              - separator [ref=e832]
              - heading "When Arb Works (and When It Does Not)" [level=2] [ref=e833]
              - heading "Favorable Conditions" [level=3] [ref=e834]
              - list [ref=e835]:
                - listitem [ref=e836]:
                  - strong [ref=e837]: High volatility
                  - text: ": large, rapid CEX price moves create bigger gaps before AMM prices adjust"
                - listitem [ref=e838]:
                  - strong [ref=e839]: Shallow DEX liquidity
                  - text: ": a thinner pool amplifies price impact of any trade, making the stale price persist longer (though it also increases your own slippage)"
                - listitem [ref=e840]:
                  - strong [ref=e841]: High DEX volume
                  - text: ": counterintuitively, high volume means more organic trades rebalancing the pool, but also more frequent opportunities when volume is directional"
                - listitem [ref=e842]:
                  - strong [ref=e843]: Low congestion
                  - text: ": lower priority fee requirements mean the bar for profitability is lower"
              - heading "Unfavorable Conditions" [level=3] [ref=e844]
              - list [ref=e845]:
                - listitem [ref=e846]:
                  - strong [ref=e847]: Low volatility / sideways markets
                  - text: ": CEX and DEX prices track each other closely, spreads are tiny"
                - listitem [ref=e848]:
                  - strong [ref=e849]: Very deep DEX liquidity
                  - text: ": large pools are harder to move, so the spread closes quickly after any price update; your advantage window is shorter"
                - listitem [ref=e850]:
                  - strong [ref=e851]: High network congestion
                  - text: ": priority fees spike, compressing or eliminating net spread"
                - listitem [ref=e852]:
                  - strong [ref=e853]: Many active competitors
                  - text: ": other searchers submit transactions in the same window, reducing your landing rate or forcing you to over-tip"
                - listitem [ref=e854]:
                  - strong [ref=e855]: Stale data
                  - text: ": if your price feeds have higher latency than competitors, by the time you see an opportunity it may already be gone"
              - separator [ref=e856]
              - heading "Key Configuration Parameters" [level=2] [ref=e857]
              - paragraph [ref=e858]:
                - text: The
                - code [ref=e859]: CEXDEXArbDetector
                - text: is configured via
                - code [ref=e860]: config/free.toml
                - text: (or
                - code [ref=e861]: pro.toml
                - text: "). The relevant fields are:"
              - code [ref=e864]: "[strategy.cex_dex_arb] min_spread_bps = 50 # Minimum net spread to emit an Opportunity position_size_usd = 100.0 # Trade size per opportunity max_price_impact_bps = 20 # Reject if estimated slippage exceeds this fee_bps = 30 # DEX swap fee (Raydium)"
              - paragraph [ref=e865]:
                - text: Start with a generous
                - code [ref=e866]: min_spread_bps
                - text: (e.g., 80–100) when backtesting to find the most obvious opportunities, then reduce it gradually as you tune your fee estimates and gain confidence in the simulation results.
              - separator [ref=e867]
