              - paragraph [ref=e483]: SOL/USDC is the highest-volume pool and the best starting point. It has the most CEX-DEX spread activity and the tightest on-chain liquidity.
              - paragraph [ref=e484]:
                - text: You can enter pool addresses directly in the Config page or pass them via the
                - code [ref=e485]: pool_addresses
                - text: config key in
                - code [ref=e486]: config/free.toml
                - text: .
              - separator [ref=e487]
              - heading "Next Steps" [level=2] [ref=e488]
              - paragraph [ref=e489]: "Once you have a backtest running, here is a natural progression:"
              - list [ref=e490]:
                - listitem [ref=e491]:
                  - paragraph [ref=e492]:
                    - strong [ref=e493]: Read "How CEX-DEX Arbitrage Works"
                    - text: — understand why the spread exists, how latency affects profitability, and what the fee math looks like before you interpret backtest results
                - listitem [ref=e494]:
                  - paragraph [ref=e495]:
                    - strong [ref=e496]: Tune and re-run
                    - text: — adjust
                    - code [ref=e497]: min_spread_bps
                    - text: and
                    - code [ref=e498]: position_size_sol
                    - text: in the Config page and re-run the backtest to see how the parameter changes affect P&L
                - listitem [ref=e499]:
                  - paragraph [ref=e500]:
                    - strong [ref=e501]: Fetch more data
                    - text: — on the
                    - strong [ref=e502]: Data
                    - text: page, set Days to 7 or 30 and re-fetch to backtest over a longer window and reduce the effect of any single day's volatility
                - listitem [ref=e503]:
                  - paragraph [ref=e504]:
                    - strong [ref=e505]: Set up paper trading
                    - text: — get a free Helius key, set
                    - code [ref=e506]: HELIUS_API_KEY
                    - text: ", and run the strategy against live data without spending anything"
                - listitem [ref=e507]:
                  - paragraph [ref=e508]:
                    - strong [ref=e509]: Read "Writing a Custom Detector"
                    - text: — build your own strategy on top of the same pipeline abstractions, whether that's liquidation hunting, sandwich detection, or something entirely new
                - listitem [ref=e510]:
                  - paragraph [ref=e511]:
                    - strong [ref=e512]: Check External Resources
                    - text: — the guides link out to Solana documentation, Jito docs, and Helius API references when you need to go deeper on the infrastructure layer
              - separator [ref=e513]
              - heading "Troubleshooting" [level=2] [ref=e514]
              - paragraph [ref=e515]:
                - strong [ref=e516]:
                  - code [ref=e517]: "mev-kit: command not found"
                - text: — make sure the Python scripts directory is on your PATH. After
                - code [ref=e518]: pip install mev-kit
                - text: ", try"
                - code [ref=e519]: python -m mev_kit
                - text: as a fallback.
              - paragraph [ref=e520]:
                - strong [ref=e521]:
                  - code [ref=e522]: "ModuleNotFoundError: No module named 'mev_kit'"
                - text: — you likely have multiple Python environments. Run
                - code [ref=e523]: which python
                - text: and
                - code [ref=e524]: which pip
                - text: to confirm they point to the same environment.
              - paragraph [ref=e525]:
                - strong [ref=e526]:
                  - code [ref=e527]: Connection refused
                  - text: on http://localhost:8080
                - text: — the
                - code [ref=e528]: mev-kit ui
                - text: process may have exited. Check the terminal where you launched it for error output.
              - paragraph [ref=e529]:
                - strong [ref=e530]: Backtest returns zero trades
                - text: — the default
                - code [ref=e531]: min_spread_bps
                - text: may be too high for the data period you fetched. Try lowering it to 5 bps to confirm the pipeline is working, then raise it back to filter for realistic opportunities.
              - paragraph [ref=e532]:
                - strong [ref=e533]: Helius WebSocket disconnects
                - text: — free tier connections have rate limits. If you see repeated disconnects, check the Helius dashboard for quota usage. The adapter retries with exponential backoff automatically, so brief disconnections self-heal.
