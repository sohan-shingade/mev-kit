            - generic [ref=e549]:
              - 'heading "MEV on Solana: Concepts" [level=1] [ref=e550]'
              - heading "What is MEV?" [level=2] [ref=e551]
              - paragraph [ref=e552]: Maximal Extractable Value (MEV) refers to profit that can be extracted from the process of including, excluding, or reordering transactions within a block. Originally coined as "Miner Extractable Value" in the Ethereum context, the term was broadened to "Maximal" as proof-of-stake chains and other architectures entered the picture.
              - paragraph [ref=e553]: In practice, MEV arises whenever a transaction's outcome depends on the order in which it is included relative to other transactions. A searcher — an entity running automated strategies — monitors the network for these opportunities and races to capture them before other searchers do.
              - paragraph [ref=e554]:
                - text: "Common MEV strategies include: -"
                - strong [ref=e555]: Arbitrage
                - text: ": exploiting price differences between venues -"
                - strong [ref=e556]: Liquidations
                - text: ": triggering undercollateralized loan repayments for a liquidation bonus -"
                - strong [ref=e557]: Sandwich attacks
                - text: ": frontrunning and backrunning large swaps to profit from the induced price impact -"
                - strong [ref=e558]: JIT (Just-in-Time) liquidity
                - text: ": providing concentrated liquidity just before a large swap and removing it immediately after"
              - paragraph [ref=e559]: mev-kit focuses primarily on the first two categories, particularly CEX-DEX arbitrage.
              - separator [ref=e560]
              - heading "How Solana Differs from Ethereum for MEV" [level=2] [ref=e561]
              - paragraph [ref=e562]: Understanding Solana's architecture is essential before writing any MEV strategy. Many assumptions that hold on Ethereum do not apply here.
              - heading "No Public Mempool" [level=3] [ref=e563]
              - paragraph [ref=e564]: On Ethereum, submitted transactions sit in a publicly visible mempool before being included in a block. This mempool is the primary data source for MEV searchers — they watch incoming transactions and react to them.
              - paragraph [ref=e565]: Solana has no equivalent public mempool. Transactions are forwarded directly to the current slot leader (the validator whose turn it is to produce a block). There is no global gossip layer broadcasting pending transactions to everyone.
              - paragraph [ref=e566]:
                - text: "The practical consequence:"
                - strong [ref=e567]: Solana MEV is not about watching pending transactions — it is about predicting what state will be profitable after the next state update arrives.
              - heading "Continuous Block Production and ~400ms Slots" [level=3] [ref=e568]
              - paragraph [ref=e569]: Ethereum produces a block roughly every 12 seconds. Solana produces one every ~400 milliseconds. That is approximately 30× faster.
              - paragraph [ref=e570]:
                - text: Each slot is assigned to a specific validator according to a publicly known
                - strong [ref=e571]: leader schedule
                - text: that is published two epochs in advance (each epoch is ~2 days). Knowing the upcoming leader lets searchers optimize which block engine endpoint to use or whether to route through Jito.
              - paragraph [ref=e572]: The 400ms slot time compresses the window in which a price discrepancy can exist and be captured. Strategies need to react in tens of milliseconds, not seconds.
              - heading "Parallel Transaction Execution (Sealevel)" [level=3] [ref=e573]
              - paragraph [ref=e574]: Solana's runtime, Sealevel, executes transactions in parallel when they touch different accounts. This increases throughput but also means that two arbitrage transactions touching the same pool accounts will serialize — only one can succeed. Failed transactions on Solana do not cost fees unless they fail inside the program (in which case they consume compute units and pay fees). A transaction that fails at preflight costs nothing.
              - paragraph [ref=e575]: This asymmetry (failed attempts are cheap) encourages high-volume spam from searchers, which is part of why Jito bundles became important.
              - heading "Transaction Fees and Priority Fees" [level=3] [ref=e576]
              - paragraph [ref=e577]:
                - text: Solana transactions pay a base fee plus an optional
                - strong [ref=e578]: priority fee
                - text: (called a compute unit price). Higher priority fees push a transaction ahead in the leader's local queue. During congestion, priority fees spike and can materially affect strategy profitability.
              - separator [ref=e579]
              - heading "Jito's Role" [level=2] [ref=e580]
              - paragraph [ref=e581]:
                - link "Jito" [ref=e582] [cursor=pointer]:
                  - /url: https://jito.wtf
                - text: is the dominant MEV infrastructure layer on Solana. It operates a
                - strong [ref=e583]: block engine
                - text: — a service that accepts transaction bundles from searchers and forwards them to Jito-client validators.
              - heading "What is a Bundle?" [level=3] [ref=e584]
              - paragraph [ref=e585]: A bundle is an atomic group of 1–5 transactions that must be included together, in order, or not at all. Atomicity means either all transactions land or none do. This is critical for strategies that require two legs (e.g., buy on DEX, hedge on CEX) to either both execute or both fail.
              - heading "The Tip Mechanism" [level=3] [ref=e586]
              - paragraph [ref=e587]:
                - text: Searchers attach a
                - strong [ref=e588]: tip
                - text: to their bundle — a SOL transfer to a Jito tip account. The tip is separate from priority fees and goes directly to the validator (shared between the validator and Jito). A higher tip increases the probability that the block engine prioritizes your bundle.
              - paragraph [ref=e589]: "Tip sizing is a strategy parameter. Too low: your bundle loses to competitors. Too high: the tip exceeds the profit and the trade is unprofitable."
              - paragraph [ref=e590]:
                - text: The
                - code [ref=e591]: JitoBundleSink
                - text: in mev-kit handles tip calculation and bundle submission. It reads
                - code [ref=e592]: min_tip_lamports
                - text: and
                - code [ref=e593]: max_tip_lamports
                - text: from your config and interpolates based on estimated profit.
              - heading "Why Searchers Use Jito" [level=3] [ref=e594]
              - list [ref=e595]:
                - listitem [ref=e596]:
                  - strong [ref=e597]: Atomicity
                  - text: ": multi-leg strategies execute safely without partial fills"
                - listitem [ref=e598]:
                  - strong [ref=e599]: Priority
                  - text: ": bundles get favorable placement in the block"
                - listitem [ref=e600]:
                  - strong [ref=e601]: Landing rate
                  - text: ": Jito validators represent a significant fraction of stake, increasing the probability your transactions land"
              - separator [ref=e602]
              - heading "Types of MEV on Solana" [level=2] [ref=e603]
              - heading "CEX-DEX Arbitrage" [level=3] [ref=e604]
              - paragraph [ref=e605]: The most common and well-understood form. A centralized exchange (e.g., Binance) and a decentralized exchange (e.g., Raydium, Orca) both list the same asset. When the CEX price moves faster than the on-chain price updates, a brief window exists where you can buy cheap on one venue and sell on the other.
              - paragraph [ref=e606]:
                - text: This is the primary strategy mev-kit ships with. See
                - 'link "Guide 2: How CEX-DEX Arbitrage Works" [ref=e607] [cursor=pointer]':
                  - /url: ./02-cex-dex-arb.md
                - text: for details.
              - heading "Liquidations" [level=3] [ref=e608]
              - paragraph [ref=e609]: Protocols like Marginfi, Mango, and Kamino allow users to borrow against collateral. If a borrower's collateral value drops below the required ratio, their position becomes liquidatable. Searchers monitor account states and submit liquidation transactions when a position crosses the threshold, collecting a liquidation bonus (typically 5–10% of the position).
              - paragraph [ref=e610]: "Liquidations are more complex than arb because they require: - Polling or subscribing to account state changes for all open positions - Computing health ratios in real time - Submitting the liquidation before competitors"
              - heading "Backrunning" [level=3] [ref=e611]
              - paragraph [ref=e612]: When a large swap moves the price of a pool significantly, there is often a reversion opportunity. A backrun transaction is submitted immediately after the large swap to capture the price correction. Unlike a sandwich attack, a backrun does not frontrun anything — it only reacts after the triggering transaction has landed.
              - paragraph [ref=e613]: Backrunning is generally considered less harmful to users than sandwich attacks.
              - heading "JIT (Just-in-Time) Liquidity" [level=3] [ref=e614]
              - paragraph [ref=e615]: Liquidity providers on AMMs like Orca (Whirlpools) can observe incoming large swaps and add concentrated liquidity in the exact price range of the swap, collecting the swap fee, then removing liquidity in the same block. This requires very low latency and precise timing. It is more of an LP optimization strategy than a pure MEV strategy, but it competes with passive LPs for fee income.
              - separator [ref=e616]
              - heading "Why SOL/USDC Arb Exists" [level=2] [ref=e617]
              - paragraph [ref=e618]: The SOL/USDC pair is the most liquid market on both Solana DEXs and Binance. It is also the canonical example for understanding CEX-DEX arb.
              - paragraph [ref=e619]: "Here is why the discrepancy arises:"
              - list [ref=e620]:
                - listitem [ref=e621]:
                  - paragraph [ref=e622]:
                    - strong [ref=e623]: Binance
                    - text: runs a central limit order book with continuous matching. Prices update in microseconds as new orders arrive.
                - listitem [ref=e624]:
                  - paragraph [ref=e625]:
                    - strong [ref=e626]: Raydium
                    - text: (or any AMM) prices assets according to the constant-product formula. The on-chain price only changes when a swap transaction actually lands in a block.
                - listitem [ref=e627]:
                  - paragraph [ref=e628]: Between Solana slots (~400ms apart), the Binance price can move significantly. The on-chain price is "stale" relative to the CEX price during this window.
                - listitem [ref=e629]:
                  - paragraph [ref=e630]: A searcher monitoring both prices simultaneously can detect when the stale on-chain price is far enough from the live CEX price to be profitable after fees.
                - listitem [ref=e631]:
                  - paragraph [ref=e632]: The searcher submits a swap transaction (often via a Jito bundle) to capture the discrepancy before the next large trade naturally corrects it.
              - paragraph [ref=e633]: The gap closes naturally through arbitrage — each successful arb trade pushes the on-chain price closer to the CEX price. In liquid markets, the gap is typically captured within a few slots.
              - heading "Why It Is Not Risk-Free" [level=3] [ref=e634]
              - paragraph [ref=e635]: "CEX-DEX arb is sometimes described as \"free money,\" but this overstates the case. Real risks include:"
              - list [ref=e636]:
                - listitem [ref=e637]:
                  - strong [ref=e638]: Execution risk
                  - text: ": your transaction may not land if the leader does not include it, or if another searcher gets there first"
                - listitem [ref=e639]:
                  - strong [ref=e640]: Slippage
                  - text: ": large positions move the pool price against you during execution"
                - listitem [ref=e641]:
                  - strong [ref=e642]: Fee risk
                  - text: ": priority fees and Jito tips can exceed profit for small spreads"
                - listitem [ref=e643]:
                  - strong [ref=e644]: Latency risk
                  - text: ": if your price feed has higher latency than competitors, you will only see opportunities they have already taken"
                - listitem [ref=e645]:
                  - strong [ref=e646]: Smart contract risk
                  - text: ": bugs in the DEX program or the arb program can cause losses"
              - paragraph [ref=e647]:
                - text: mev-kit's simulation layer (
                - code [ref=e648]: RPCSimulator
                - text: ) gates every opportunity through a transaction simulation before executing. This catches many failure modes before they cost real money.
              - separator [ref=e649]
