              - paragraph [ref=e1243]:
                - text: A Detector is the second layer of the mev-kit pipeline. It receives
                - code [ref=e1244]: StateUpdate
                - text: objects emitted by an
                - code [ref=e1245]: IngestAdapter
                - text: and decides whether to emit an
                - code [ref=e1246]: Opportunity
                - text: . Writing your own detector is the primary way to implement a new MEV strategy without touching any other part of the pipeline.
              - paragraph [ref=e1247]:
                - text: This guide walks through building a complete, working
                - code [ref=e1248]: SpreadTracker
