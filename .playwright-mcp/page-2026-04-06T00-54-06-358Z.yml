              - 'heading "Pattern: Staleness Checking" [level=3] [ref=e1351]'
              - paragraph [ref=e1352]: "If you haven't received a DEX update in 5 seconds, your cached pool price is stale. Check timestamps before emitting:"
              - code [ref=e1355]: "MAX_STALENESS_MS = 5_000 def _maybe_emit_opportunity(self) -> Opportunity | None: now_ms = int(time.time() * 1_000) if now_ms - self._last_pool_update_ms > MAX_STALENESS_MS: logger.warning(\"pool_state_stale\", age_ms=now_ms - self._last_pool_update_ms) return None # ... rest of logic"
