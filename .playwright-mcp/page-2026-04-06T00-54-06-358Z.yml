              - paragraph [ref=e1357]: "If your strategy watches multiple pools, store state per pool address:"
              - code [ref=e1360]: "self._pool_states: dict[str, PoolState] = {} async def _handle_pool_state(self, update: PoolState) -> Opportunity | None: self._pool_states[update.pool_address] = update # Find the best opportunity across all pools return self._best_opportunity()"
              - 'heading "Pitfall: Blocking the Event Loop" [level=3] [ref=e1361]'
              - paragraph [ref=e1362]:
                - text: Never perform synchronous I/O (file reads, HTTP calls,
                - code [ref=e1363]: time.sleep
