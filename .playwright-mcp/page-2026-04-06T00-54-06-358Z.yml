              - code [ref=e1276]: "# src/mev_kit/strategies/base.py from abc import ABC, abstractmethod from mev_kit.models.state import StateUpdate from mev_kit.models.opportunity import Opportunity class Detector(ABC): \"\"\"Abstract base class for all MEV opportunity detectors.\"\"\" @abstractmethod async def process(self, update: StateUpdate) -> Opportunity | None: \"\"\"Process a single StateUpdate. Args: update: A StateUpdate emitted by an IngestAdapter. May be a PriceUpdate, PoolState, or AccountUpdate. Returns: An Opportunity if one was detected, or None. \"\"\" ..."
