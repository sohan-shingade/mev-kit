                - code [ref=e1365]: process
                - text: for every incoming update. Any blocking call here stalls the entire pipeline.
              - code [ref=e1368]: "# WRONG - blocks the event loop async def process(self, update: StateUpdate) -> Opportunity | None: response = requests.get(\"https://...\") # DO NOT do this # RIGHT - use async I/O async def process(self, update: StateUpdate) -> Opportunity | None: async with httpx.AsyncClient() as client: response = await client.get(\"https://...\") # OK"
