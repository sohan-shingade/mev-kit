                  - generic [ref=e3031]: "\"\"\"Volatility Breakout Detector — Bollinger Band squeeze-and-break strategy."
                  - generic [ref=e3033]: Monitors the CEX-DEX spread and detects when volatility contracts (squeeze)
                  - generic [ref=e3035]: followed by a rapid expansion (breakout). This is a classic volatility
                  - generic [ref=e3037]: "regime-change detector adapted for MEV: when spreads have been tight and"
                  - generic [ref=e3039]: suddenly blow out, there is a high-probability directional move underway
                  - generic [ref=e3041]: that MEV searchers can exploit before the spread mean-reverts.
                  - generic [ref=e3044]: "The core insight: low-volatility regimes in CEX-DEX spreads indicate"
                  - generic [ref=e3046]: equilibrium. When that equilibrium breaks, the first movers capture the
                  - generic [ref=e3048]: spread before market makers re-price. This detector identifies the exact
                  - generic [ref=e3050]: moment of regime change.
                  - generic [ref=e3053]: "Algorithm:"
                  - generic [ref=e3055]: 1. Track a rolling window of CEX-DEX spread values
                  - generic [ref=e3057]: 2. Compute Bollinger Bands (mean +/- k*std) on the spread
                  - generic [ref=e3059]: 3. Measure "bandwidth" (band width / mean) as volatility proxy
                  - generic [ref=e3061]: "4. Detect SQUEEZE: bandwidth falls below squeeze_threshold"
                  - generic [ref=e3063]: "5. Detect BREAKOUT: after squeeze, spread pierces upper or lower band"
                  - generic [ref=e3065]: 6. Emit opportunity in the direction of the breakout
                  - generic [ref=e3068]: "REQUIRED_DATA_SOURCES:"
                  - generic [ref=e3070]: "- Source.BINANCE_WS: CEX reference price"
                  - generic [ref=e3072]: "- Source.HELIUS_WS or Source.PARQUET_REPLAY: DEX price feed"
                  - generic [ref=e3074]: "Demonstrates:"
                  - generic [ref=e3076]: "- Multi-phase state machine (IDLE -> SQUEEZE -> BREAKOUT)"
                  - generic [ref=e3078]: "- Rolling statistics with O(1) updates"
                  - generic [ref=e3080]: "- Regime-change detection pattern"
                  - generic [ref=e3082]: "- Cooldown and rate-limiting"
                  - generic [ref=e3084]: "\"\"\""
