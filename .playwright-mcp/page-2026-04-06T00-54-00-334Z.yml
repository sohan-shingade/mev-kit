              - heading "Overview" [level=2] [ref=e900]
              - paragraph [ref=e901]:
                - text: mev-kit organizes every strategy into a five-layer pipeline. Each layer is a pluggable interface — you can swap implementations without touching strategy code. The same
                - code [ref=e902]: CEXDEXArbDetector
                - text: runs identically against live Raydium data, a paper-trading feed, or a Parquet file of historical pool states.
              - code [ref=e905]: ┌─────────────────────────────────────────────────────────────────┐ │ mev-kit Pipeline │ │ │ │ ┌──────────┐ StateUpdate ┌──────────┐ Opportunity │ │ │ Source │ ──────────────► │ Detector │ ───────────────► │ │ │(Ingest │ │ │ │ │ │ Adapter) │ └──────────┘ │ │ └──────────┘ │ │ │ │ │ Opportunity │ │ │ ▼ │ │ │ ┌─────────────────┐ │ │ │ │ Simulator │ │ │ │ │ (validates txn) │ │ │ │ └────────┬────────┘ │ │ │ │ │ │ │ SimulationResult │ │ │ │ │ │ │ ▼ │ │ │ ┌──────────┐ │ │ │ │ Sink │ │ │ │ │(execute /│ │ │ │ │ log it) │ │ │ │ └──────────┘ │ │ │ │ │ │ └─────────────────────────────┴──► Monitor │ └─────────────────────────────────────────────────────────────────┘
              - paragraph [ref=e906]: Data flows left-to-right and top-to-bottom. Every arrow carries a typed Pydantic model — no raw dicts cross layer boundaries.
