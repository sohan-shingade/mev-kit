                - listitem [ref=e1192]: Processing a Parquet replay of last Tuesday's data (backtest mode)
                - listitem [ref=e1193]: Receiving live Helius + Binance data but not submitting real transactions (paper mode)
                - listitem [ref=e1194]: Running with full Jito bundle submission (live mode)
              - paragraph [ref=e1195]:
                - text: The
                - code [ref=e1196]: PipelineRunner
                - text: is configured with concrete adapter instances, and the strategy only sees the abstract interface. Switching from backtest to paper to live is a config file change, not a code change.
              - code [ref=e1199]: "# config/free.toml (backtest section) [pipeline.backtest] ingest = \"ParquetReplayAdapter\" simulator = \"RPCSimulator\" sink = \"BacktestSink\" [pipeline.paper] ingest = [\"HeliusWSAdapter\", \"BinanceWSAdapter\"] simulator = \"RPCSimulator\" sink = \"PaperTradeSink\" [pipeline.live] ingest = [\"HeliusWSAdapter\", \"BinanceWSAdapter\"] simulator = \"RPCSimulator\" sink = \"JitoBundleSink\""
              - separator [ref=e1200]
              - heading "Data Flow in Detail" [level=2] [ref=e1201]
              - paragraph [ref=e1202]: "Here is the sequence of events for a single arbitrage opportunity, from detection to execution:"
              - code [ref=e1205]: "1. BinanceWSAdapter receives a SOL/USDC price tick from Binance → emits PriceUpdate into the async queue 2. PipelineRunner.run_loop() dequeues the PriceUpdate → calls detector.process(PriceUpdate) 3. CEXDEXArbDetector updates its internal cex_price state → no opportunity yet (waiting for pool state) 4. HeliusWSAdapter receives a Raydium pool account update → emits PoolState into the async queue 5. PipelineRunner dequeues the PoolState → calls detector.process(PoolState) 6. CEXDEXArbDetector calculates spread = 65 bps, net spread = 18 bps → net spread > min_spread_bps (15 bps threshold) → returns Opportunity(type=CEX_DEX_ARB_BUY, ...) 7. PipelineRunner receives non-None Opportunity → calls simulator.simulate(opportunity) 8. RPCSimulator constructs swap transaction → calls Helius simulateTransaction RPC → returns SimulationResult(profitable=True, net_profit_usd=0.09) 9. PipelineRunner receives profitable SimulationResult → calls sink.send(opportunity, simulation_result) 10. JitoBundleSink (or PaperTradeSink in paper mode): → constructs Jito bundle with swap transaction + tip → signs with wallet keypair → submits to Jito block engine → logs ExecutionResult to Monitor 11. Monitor logs all events with timestamps → updates pipeline latency histogram → increments detection_rate, landing_rate counters"
              - paragraph [ref=e1206]: "Total wall-clock time for steps 1–10 in live mode: typically 200–600ms on a well-connected server."
