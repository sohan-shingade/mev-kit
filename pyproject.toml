[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mev-kit"
version = "0.1.0"
description = "Solana MEV research, development, and deployment framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "So" }]
keywords = ["solana", "mev", "defi", "arbitrage", "jito"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "asyncio-mqtt>=0.16",
    "websockets>=12.0",
    "httpx>=0.27",
    "solders>=0.21",
    "solana>=0.34",
    "aiosqlite>=0.20",
    "pyarrow>=15.0",
    "polars>=0.20",
    "click>=8.1",
    "tomli>=2.0",
    "structlog>=24.0",
    "base58>=2.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
    "pygments>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
]
pro = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
]

[project.scripts]
mev-kit = "mev_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mev_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
